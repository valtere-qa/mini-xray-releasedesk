name: Provision and deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Validate Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || (echo "CLOUDFLARE_API_TOKEN fehlt" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "CLOUDFLARE_ACCOUNT_ID fehlt" && exit 1)

      - name: Create or reuse D1 database
        id: database
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database?name=mini-xray-releasedesk-db" > d1-list.json
          DB_ID=$(node -e 'const d=require("./d1-list.json"); const x=(d.result||[]).find(v=>v.name==="mini-xray-releasedesk-db"); if(x) process.stdout.write(x.uuid||x.id)')
          if [ -z "$DB_ID" ]; then
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"name":"mini-xray-releasedesk-db"}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database" > d1-create.json
            DB_ID=$(node -e 'const d=require("./d1-create.json"); process.stdout.write(d.result.uuid||d.result.id)')
          fi
          test -n "$DB_ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and frontend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production API and dialogs
        run: |
          curl --fail-with-body --retry 5 --retry-delay 2 https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/health
          for ATTEMPT in {1..10}; do
            curl --fail-with-body --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/?deployment=$GITHUB_SHA&attempt=$ATTEMPT" > ui.html
            if grep -Fq 'id="bootShell"' ui.html && grep -Fq 'function verifySession' ui.html && grep -Fq 'function logoutImmediately' ui.html; then
              break
            fi
            sleep 3
          done
          grep -Fq 'id="confirmActionModal"' ui.html
          grep -Fq 'function askConfirmation' ui.html
          grep -Fq 'id="appTooltip"' ui.html
          grep -Fq 'data-tooltip="Testdurchführung bearbeiten:' ui.html
          grep -Fq 'function showAppTooltip' ui.html
          grep -Fq 'id="bootShell"' ui.html
          grep -Fq 'class="auth-shell hidden"' ui.html
          grep -Fq 'function verifySession' ui.html
          grep -Fq 'function logoutImmediately' ui.html
          grep -Fq 'Mobile full-page scroll safety' ui.html
          grep -Fq 'padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))!important' ui.html
          grep -Fq '.modal.open{overflow-x:hidden;overflow-y:auto' ui.html
          grep -Fq 'id="sideTheme"' ui.html
          grep -Fq 'id="settingsModal"' ui.html
          grep -Fq 'function applyThemeColor' ui.html
          if grep -Fq '(async()=>{showAuth();' ui.html; then echo "Login-Flash-Bootstrap gefunden" && exit 1; fi
          if grep -Fq 'confirm(' ui.html; then echo "Native Browser-Bestätigung gefunden" && exit 1; fi

      - name: Verify registration and authenticated session
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sleep 10
          TEST_EMAIL="releasedesk-smoke-$(date +%s)@example.invalid"
          HTTP_CODE=$(curl -sS -o register.json -w "%{http_code}" -c cookies.txt -H "Content-Type: application/json" --data "{\"name\":\"ReleaseDesk Smoke Test\",\"email\":\"$TEST_EMAIL\",\"password\":\"ReleaseDesk123\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/auth/register)
          cat register.json
          test "$HTTP_CODE" = "201"
          curl --fail-with-body -sS -b cookies.txt https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/auth/me > me.json
          node -e 'const d=require("./me.json"); if(!d.user?.email) process.exit(1)'
          curl --fail-with-body -sS -b cookies.txt -X PATCH -H "Content-Type: application/json" --data '{"accentColor":"#6554C0"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/preferences > preferences.json
          node -e 'const d=require("./preferences.json"); if(d.accentColor!=="#6554C0") process.exit(1)'
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"name":"Persistence Smoke Release","executionKey":"SMOKE-1","environment":"CI"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases > release.json
          RELEASE_ID=$(node -e 'const d=require("./release.json"); if(!d.id) process.exit(1); process.stdout.write(d.id)')
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"key":"SMOKE-101","summary":"D1 persistence verification","status":"TO DO"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID/tests > test.json
          TEST_ID=$(node -e 'const d=require("./test.json"); const t=d.tests.find(x=>x.test_key==="SMOKE-101"); if(!t) process.exit(1); process.stdout.write(t.id)')
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"action":"start"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/tests/$TEST_ID/timer > timer-start.json
          sleep 1
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"action":"stop"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/tests/$TEST_ID/timer > timer-stop.json
          node -e 'const d=require("./timer-stop.json"); const t=d.tests?.find(x=>x.id===process.argv[1]); if(!t||t.timer_started_at!==null||Number(t.execution_time_seconds)<1||!t.last_executed_at) process.exit(1)' "$TEST_ID"
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"key":"TP-SMOKE","name":"Test Plan Smoke","status":"ACTIVE"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/plans > plan.json
          PLAN_ID=$(node -e 'const d=require("./plan.json"); if(!d.id) process.exit(1); process.stdout.write(d.id)')
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"key":"TP-SMOKE-NEW","name":"Replacement Plan Smoke","status":"ACTIVE"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/plans > plan-new.json
          PLAN_NEW_ID=$(node -e 'const d=require("./plan-new.json"); if(!d.id) process.exit(1); process.stdout.write(d.id)')
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"name":"Replacement Execution Smoke","executionKey":"SMOKE-2","environment":"CI"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases > release-new.json
          REPLACEMENT_RELEASE_ID=$(node -e 'const d=require("./release-new.json"); if(!d.id) process.exit(1); process.stdout.write(d.id)')
          curl --fail-with-body -sS -b cookies.txt -X PATCH -H "Content-Type: application/json" --data "{\"planId\":\"$PLAN_ID\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID > plan-assignment.json
          node -e 'const d=require("./plan-assignment.json"); if(d.plan_id!==process.argv[1]) process.exit(1)' "$PLAN_ID"
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data "{\"replacementReleaseId\":\"$REPLACEMENT_RELEASE_ID\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID/replace-in-plan > execution-replacement.json
          node -e 'const d=require("./execution-replacement.json"); if(d.current?.plan_id!==null||d.replacement?.plan_id!==process.argv[1]) process.exit(1)' "$PLAN_ID"
          curl --fail-with-body -sS -b cookies.txt -X PATCH -H "Content-Type: application/json" --data "{\"planId\":\"$PLAN_NEW_ID\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$REPLACEMENT_RELEASE_ID > plan-switch.json
          node -e 'const d=require("./plan-switch.json"); if(d.plan_id!==process.argv[1]) process.exit(1)' "$PLAN_NEW_ID"
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data "{\"stepNo\":1,\"action\":\"Login durchführen\",\"data\":\"qa.user@example.test\",\"expectedResult\":\"Dashboard sichtbar\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/tests/$TEST_ID/steps > step.json
          STEP_ID=$(node -e 'const d=require("./step.json"); const t=d.tests.find(x=>x.id===process.argv[1]); if(!t?.steps?.[0]?.id) process.exit(1); process.stdout.write(t.steps[0].id)' "$TEST_ID")
          curl --fail-with-body -sS -b cookies.txt -X PATCH -H "Content-Type: application/json" --data '{"status":"PASSED","actualResult":"Dashboard wurde angezeigt","comment":"Smoke Test erfolgreich"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/steps/$STEP_ID > step-status.json
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"key":"PRE-SMOKE","name":"Aktiver Testbenutzer","condition":"Benutzer ist registriert","status":"ACTIVE"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/preconditions > precondition.json
          PRECONDITION_ID=$(node -e 'const d=require("./precondition.json"); if(!d.id) process.exit(1); process.stdout.write(d.id)')
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data "{\"preconditionId\":\"$PRECONDITION_ID\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/tests/$TEST_ID/preconditions > precondition-link.json
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"key":"TS-SMOKE","name":"Regression Smoke","description":"Automatischer Test","status":"ACTIVE"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/test-sets > testset.json
          TEST_SET_ID=$(node -e 'const d=require("./testset.json"); if(!d.id) process.exit(1); process.stdout.write(d.id)')
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data "{\"testCaseId\":\"$TEST_ID\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/test-sets/$TEST_SET_ID/tests > testset-link.json
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data "{\"testCaseId\":\"$TEST_ID\",\"key\":\"BUG-SMOKE\",\"summary\":\"Defect persistence verification\",\"severity\":\"Major\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/defects > defect.json
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data "{\"testCaseId\":\"$TEST_ID\",\"fileName\":\"pixel.png\",\"mimeType\":\"image/png\",\"dataBase64\":\"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/evidence > evidence.json
          curl --fail-with-body -sS -b cookies.txt -X POST -H "Content-Type: application/json" --data '{}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/auth/logout > logout.json
          curl --fail-with-body -sS -c cookies.txt -H "Content-Type: application/json" --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"ReleaseDesk123\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/auth/login > login.json
          curl --fail-with-body -sS -b cookies.txt https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/preferences > persisted-preferences.json
          node -e 'const d=require("./persisted-preferences.json"); if(d.accentColor!=="#6554C0") process.exit(1)'
          curl --fail-with-body -sS -b cookies.txt https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID > persisted.json
          node -e 'const d=require("./persisted.json"); const t=d.tests?.find(x=>x.test_key==="SMOKE-101"); const s=t?.steps?.[0]; if(!t||t.defects?.[0]?.defect_key!=="BUG-SMOKE"||t.evidence?.[0]?.file_name!=="pixel.png"||s?.status!=="PASSED"||s?.actual_result!=="Dashboard wurde angezeigt"||t.preconditions?.[0]?.precondition_key!=="PRE-SMOKE"||t.test_sets?.[0]?.set_key!=="TS-SMOKE"||Number(t.execution_time_seconds)<1||!t.last_executed_at||t.timer_started_at!==null) process.exit(1)'
          curl --fail-with-body -sS -b cookies.txt -X DELETE https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID/tests > reset-tests.json
          node -e 'const d=require("./reset-tests.json"); if(!d.ok||Number(d.deleted)!==1) process.exit(1)'
          curl --fail-with-body -sS -b cookies.txt https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID > reset-release.json
          node -e 'const d=require("./reset-release.json"); if(!Array.isArray(d.tests)||d.tests.length!==0) process.exit(1)'
          curl --fail-with-body -sS -b cookies.txt https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID/audit > reset-audit.json
          node -e 'const d=require("./reset-audit.json"); if(!d.some(x=>x.field==="Testfälle geleert"&&x.old_value==="1"&&x.new_value==="0")) process.exit(1)'
          curl --fail-with-body -sS -b cookies.txt -X DELETE https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID > cleanup.json
          curl --fail-with-body -sS -b cookies.txt -X DELETE https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$REPLACEMENT_RELEASE_ID > replacement-cleanup.json
          curl --fail-with-body -sS -b cookies.txt -X DELETE https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/plans/$PLAN_ID > plan-cleanup.json
          curl --fail-with-body -sS -b cookies.txt -X DELETE https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/plans/$PLAN_NEW_ID > plan-new-cleanup.json
          curl --fail-with-body -sS -b cookies.txt -X DELETE https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/preconditions/$PRECONDITION_ID > precondition-cleanup.json
          curl --fail-with-body -sS -b cookies.txt -X DELETE https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/test-sets/$TEST_SET_ID > testset-cleanup.json
          npx wrangler d1 execute DB --remote --command "DELETE FROM users WHERE email='$TEST_EMAIL'"
