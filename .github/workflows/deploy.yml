name: Provision and deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Validate Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || (echo "CLOUDFLARE_API_TOKEN fehlt" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "CLOUDFLARE_ACCOUNT_ID fehlt" && exit 1)

      - name: Create or reuse D1 database
        id: database
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database?name=mini-xray-releasedesk-db" > d1-list.json
          DB_ID=$(node -e 'const d=require("./d1-list.json"); const x=(d.result||[]).find(v=>v.name==="mini-xray-releasedesk-db"); if(x) process.stdout.write(x.uuid||x.id)')
          if [ -z "$DB_ID" ]; then
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"name":"mini-xray-releasedesk-db"}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database" > d1-create.json
            DB_ID=$(node -e 'const d=require("./d1-create.json"); process.stdout.write(d.result.uuid||d.result.id)')
          fi
          test -n "$DB_ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and frontend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production API
        run: curl --fail-with-body --retry 5 --retry-delay 2 https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/health

      - name: Verify registration and authenticated session
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sleep 10
          TEST_EMAIL="releasedesk-smoke-$(date +%s)@example.invalid"
          HTTP_CODE=$(curl -sS -o register.json -w "%{http_code}" -c cookies.txt -H "Content-Type: application/json" --data "{\"name\":\"ReleaseDesk Smoke Test\",\"email\":\"$TEST_EMAIL\",\"password\":\"ReleaseDesk123\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/auth/register)
          cat register.json
          test "$HTTP_CODE" = "201"
          curl --fail-with-body -sS -b cookies.txt https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/auth/me > me.json
          node -e 'const d=require("./me.json"); if(!d.user?.email) process.exit(1)'
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"name":"Persistence Smoke Release","executionKey":"SMOKE-1","environment":"CI"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases > release.json
          RELEASE_ID=$(node -e 'const d=require("./release.json"); if(!d.id) process.exit(1); process.stdout.write(d.id)')
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"key":"SMOKE-101","summary":"D1 persistence verification","status":"TO DO"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID/tests > test.json
          TEST_ID=$(node -e 'const d=require("./test.json"); const t=d.tests.find(x=>x.test_key==="SMOKE-101"); if(!t) process.exit(1); process.stdout.write(t.id)')
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data '{"key":"TP-SMOKE","name":"Test Plan Smoke","status":"ACTIVE"}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/plans > plan.json
          PLAN_ID=$(node -e 'const d=require("./plan.json"); if(!d.id) process.exit(1); process.stdout.write(d.id)')
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data "{\"testCaseId\":\"$TEST_ID\",\"key\":\"BUG-SMOKE\",\"summary\":\"Defect persistence verification\",\"severity\":\"Major\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/defects > defect.json
          curl --fail-with-body -sS -b cookies.txt -H "Content-Type: application/json" --data "{\"testCaseId\":\"$TEST_ID\",\"fileName\":\"pixel.png\",\"mimeType\":\"image/png\",\"dataBase64\":\"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/evidence > evidence.json
          curl --fail-with-body -sS -b cookies.txt -X POST -H "Content-Type: application/json" --data '{}' https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/auth/logout > logout.json
          curl --fail-with-body -sS -c cookies.txt -H "Content-Type: application/json" --data "{\"email\":\"$TEST_EMAIL\",\"password\":\"ReleaseDesk123\"}" https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/auth/login > login.json
          curl --fail-with-body -sS -b cookies.txt https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID > persisted.json
          node -e 'const d=require("./persisted.json"); const t=d.tests?.find(x=>x.test_key==="SMOKE-101"); if(!t||t.defects?.[0]?.defect_key!=="BUG-SMOKE"||t.evidence?.[0]?.file_name!=="pixel.png") process.exit(1)'
          curl --fail-with-body -sS -b cookies.txt -X DELETE https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/releases/$RELEASE_ID > cleanup.json
          curl --fail-with-body -sS -b cookies.txt -X DELETE https://mini-xray-releasedesk.vafa-qa-engineering.workers.dev/api/plans/$PLAN_ID > plan-cleanup.json
          npx wrangler d1 execute DB --remote --command "DELETE FROM users WHERE email='$TEST_EMAIL'"
